# Deux services Render sur le MEME repo GitHub :
#
# 1) tournament-manager (prod) → branche main → Hub + Engine + Manager Live
#    URL : https://tournament-manager-9ytu.onrender.com
#
# 2) tournament-manager-preview → staging (optionnel, branche feature/*)
#
# 3) tournament-manager-engine-v2 → branche feature/engine-v2 → Engine V2 (render PDF)
#    URL : https://tournament-manager-engine-v2.onrender.com
#    PDF via PyMuPDF + rendu Live — pas de LibreOffice. N'affecte pas Engine prod ni preview Hub.
# 4) tournament-manager-platform → branche feature/platform → Comptes + club + tournois
#    URL : https://tournament-manager-platform.onrender.com (à créer)
#    PostgreSQL dédié. Engine V2 reste sur tournament-manager-engine-v2 (inchangé).
#
services:
  - type: web
    name: tournament-manager
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: live-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DEPLOY_TARGET
        value: engine
      - key: PDF_CONVERTER
        value: libreoffice
      - key: LIVE_DATA_DIR
        value: /data/_live
      - key: OWNER_EMAIL
        value: remi.difrancia.perso@gmail.com
      - key: EMAIL_FROM
        value: Padel Tournament Engine <onboarding@resend.dev>

  - type: web
    name: tournament-manager-engine-v2
    runtime: docker
    plan: starter
    branch: feature/engine-v2
    dockerfilePath: ./Dockerfile.engine-v2
    dockerContext: .
    healthCheckPath: /api/v2/health
    autoDeploy: true
    disk:
      name: live-data-v2
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DEPLOY_TARGET
        value: engine-v2
      - key: PDF_CONVERTER
        value: libreoffice
      - key: LIVE_DATA_DIR
        value: /data/_live
      - key: OWNER_EMAIL
        value: remi.difrancia.perso@gmail.com
      - key: EMAIL_FROM
        value: Padel Tournament Engine <onboarding@resend.dev>

  - type: web
    name: tournament-manager-platform
    runtime: docker
    plan: starter
    branch: feature/platform
    dockerfilePath: ./Dockerfile.platform
    dockerContext: .
    healthCheckPath: /api/platform/health
    autoDeploy: true
    envVars:
      - key: DEPLOY_TARGET
        value: platform
      - key: ENGINE_V2_URL
        value: https://tournament-manager-engine-v2.onrender.com
      - key: PLATFORM_PUBLIC_URL
        value: https://tournament-manager-platform.onrender.com
      - key: PLATFORM_SEED_TEST_USERS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tournament-platform-db
          property: connectionString

  - type: web
    name: tournament-manager-preview
    runtime: docker
    plan: starter
    branch: feature/manager
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    disk:
      name: live-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DEPLOY_TARGET
        value: manager-preview
      - key: ENGINE_GENERATE_URL
        value: https://tournament-manager-9ytu.onrender.com
      - key: PDF_CONVERTER
        value: libreoffice
      - key: LIVE_DATA_DIR
        value: /data/_live
      - key: OWNER_EMAIL
        value: remi.difrancia.perso@gmail.com
      - key: EMAIL_FROM
        value: Padel Tournament Engine <onboarding@resend.dev>

databases:
  - name: tournament-platform-db
    plan: free
    databaseName: platform
    user: platform
